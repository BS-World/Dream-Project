    <div class="quiz-container">

        <h1 class="text-center">React.JS Professional Certification</h1>

        <form id="quiz-form">
            <!-- Question 1 -->
            <div class="mb-3">
                <label class="form-label fw-bold">1. Which of the following methods is used to update the state in a
                    React class component?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q1" value="correct" class="form-check-input" id="q1a">
                    <label class="form-check-label" for="q1a">this.setState()</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q1" value="wrong" class="form-check-input" id="q1b">
                    <label class="form-check-label" for="q1b">this.state.update()</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q1" value="wrong" class="form-check-input" id="q1c">
                    <label class="form-check-label" for="q1c">setStateDirectly()</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q1" value="wrong" class="form-check-input" id="q1d">
                    <label class="form-check-label" for="q1d">updateState()</label>
                </div>
            </div>


            <!-- More Questions (2-19) -->
            <div class="mb-3">
                <label class="form-label fw-bold">2. What is the purpose of React's <code> useEffect</code>
                    hook?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q2" value="correct" class="form-check-input" id="q2a">
                    <label class="form-check-label" for="q2a">To fetch data and perform side effects in function
                        components.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q2" value="wrong" class="form-check-input" id="q2b">
                    <label class="form-check-label" for="q2b">To optimize component performance.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q2" value="wrong" class="form-check-input" id="q2c">
                    <label class="form-check-label" for="q2c">To handle state management.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q2" value="wrong" class="form-check-input" id="q2d">
                    <label class="form-check-label" for="q2d">To manage component styles.</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">3. Which of the following is true about React keys?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q3" value="correct" class="form-check-input" id="q3a">
                    <label class="form-check-label" for="q3a">They help identify which items in a list have changed, are
                        added, or are removed.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q3" value="wrong" class="form-check-input" id="q3b">
                    <label class="form-check-label" for="q3b">Keys can be duplicated in the same list.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q3" value="wrong" class="form-check-input" id="q3c">
                    <label class="form-check-label" for="q3c">Keys must be globally unique across the
                        application.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q3" value="wrong" class="form-check-input" id="q3d">
                    <label class="form-check-label" for="q3d">They are only required for stateful components</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">4. What is JSX in React?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q4" value="wrong" class="form-check-input" id="q4a">
                    <label class="form-check-label" for="q4a">A CSS framework for styling React applications.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q4" value="wrong" class="form-check-input" id="q4b">
                    <label class="form-check-label" for="q4b">A built-in function in React for DOM manipulation.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q4" value="wrong" class="form-check-input" id="q4c">
                    <label class="form-check-label" for="q4c">A JavaScript function for creating components.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q4" value="correct" class="form-check-input" id="q4d">
                    <label class="form-check-label" for="q4d">A syntax extension for JavaScript that allows writing HTML
                        in React.</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">5. How can you pass data from a parent component to a child component
                    in React?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q5" value="wrong" class="form-check-input" id="q5a">
                    <label class="form-check-label" for="q5a">Using <code>this.setState</code> in the child
                        component</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q5" value="correct" class="form-check-input" id="q5b">
                    <label class="form-check-label" for="q5b">Using <code>props</code> in the child component.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q5" value="wrong" class="form-check-input" id="q5c">
                    <label class="form-check-label" for="q5c">Using <code>context</code> directly.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q5" value="wrong" class="form-check-input" id="q5d">
                    <label class="form-check-label" for="q5d">Using <code>state</code> in the parent component.</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">6. Which method in React class components is called after a component
                    is rendered for the first time?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q6" value="correct" class="form-check-input" id="q6a">
                    <label class="form-check-label" for="q6a">componentDidMount</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q6" value="wrong" class="form-check-input" id="q6b">
                    <label class="form-check-label" for="q6b">componentWillMount</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q6" value="wrong" class="form-check-input" id="q6c">
                    <label class="form-check-label" for="q6c">componentWillUpdate</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q6" value="wrong" class="form-check-input" id="q6d">
                    <label class="form-check-label" for="q6d">shouldComponentUpdate</label>
                </div>
            </div>


            <!-- Question 7 -->
            <div class="mb-3">
                <label class="form-label fw-bold">7. What is the purpose of the <code>React.Fragment</code>
                    component?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q7" value="wrong" class="form-check-input" id="q7a">
                    <label class="form-check-label" for="q7a">To style React components.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q7" value="correct" class="form-check-input" id="q7b">
                    <label class="form-check-label" for="q7b">To wrap multiple elements without adding an extra DOM
                        node.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q7" value="wrong" class="form-check-input" id="q7c">
                    <label class="form-check-label" for="q7c">To replace the <code>div</code> tag in JSX.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q7" value="wrong" class="form-check-input" id="q7d">
                    <label class="form-check-label" for="q7d">To optimize the performance of React applications.</label>
                </div>
            </div>

            <!-- Question 8 -->
            <div class="mb-3">
                <label class="form-label fw-bold">8. How can you optimize a React component's performance?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q8" value="wrong" class="form-check-input" id="q8a">
                    <label class="form-check-label" for="q8a">Use the <code>useEffect</code> hook for all
                        functions.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q8" value="wrong" class="form-check-input" id="q8b">
                    <label class="form-check-label" for="q8b">Always use inline CSS.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q8" value="wrong" class="form-check-input" id="q8c">
                    <label class="form-check-label" for="q8c">Disable state updates.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q8" value="correct" class="form-check-input" id="q8d">
                    <label class="form-check-label" for="q8d">Memoize components using <code>React.memo</code> or
                        <code>useMemo</code>.</label>
                </div>
            </div>

            <!-- Question 9 -->
            <div class="mb-3">
                <label class="form-label fw-bold">9. What does the <code>useState</code> hook return?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q9" value="wrong" class="form-check-input" id="q9a">
                    <label class="form-check-label" for="q9a">An object containing the state value and a function to
                        update it.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q9" value="wrong" class="form-check-input" id="q9b">
                    <label class="form-check-label" for="q9b">A function to get the current state value.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q9" value="wrong" class="form-check-input" id="q9c">
                    <label class="form-check-label" for="q9c">A function to reset the state value.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q9" value="correct" class="form-check-input" id="q9d">
                    <label class="form-check-label" for="q9d"> An array with the state value and a function to update
                        it.</label>
                </div>
            </div>

            <!-- Question 10 -->
            <div class="mb-3">
                <label class="form-label fw-bold">10. What is the correct way to handle events in React?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q10" value="wrong" class="form-check-input" id="q10a">
                    <label class="form-check-label" for="q10a">Using inline event handlers with strings.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q10" value="wrong" class="form-check-input" id="q10b">
                    <label class="form-check-label" for="q10b">Directly modifying the DOM with JavaScript.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q10" value="correct" class="form-check-input" id="q10c">
                    <label class="form-check-label" for="q10c">Using event handlers as functions passed to JSX
                        elements.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q10" value="wrong" class="form-check-input" id="q10d">
                    <label class="form-check-label" for="q10d">Using the on prefix for attribute names, like
                        onClickEvent.</label>
                </div>
            </div>

            <!-- Question 11 -->
            <div class="mb-3">
                <label class="form-label fw-bold">11. What does the useContext hook do in React?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q11" value="wrong" class="form-check-input" id="q11a">
                    <label class="form-check-label" for="q11a">It creates a new React context.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q11" value="correct" class="form-check-input" id="q11b">
                    <label class="form-check-label" for="q11b">It allows a component to consume a context's
                        value.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q11" value="wrong" class="form-check-input" id="q11c">
                    <label class="form-check-label" for="q11c">It initializes global state for the application.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q11" value="wrong" class="form-check-input" id="q11d">

                </div>
            </div>

            <!-- Question 12 -->
            <div class="mb-3">
                <label class="form-label fw-bold">12. What is the purpose of PropTypes in React?</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q12" value="correct" class="form-check-input" id="q12a">
                    <label class="form-check-label" for="q12a">To define the types of props that a component

                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q12" value="wrong" class="form-check-input" id="q12b">
                    <label class="form-check-label" for="q12b">To optimize component rendering.</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q12" value="wrong" class="form-check-input" id="q12c">

                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="q12" value="wrong" class="form-check-input" id="q12d">

            <div class="mb-3">

                <div class="form-check form-check-inline">
                    <input type="radio" name="q13" value="correct" class="form-check-input" id="q13b">

    <script>
        function calculateScore() {
            const form = document.getElementById('quiz-form');
            const inputs = form.querySelectorAll('input[type=radio]:checked');
            let score = 0;

            inputs.forEach(input => {
                if (input.value === 'correct') {
                    score += 100 / 19; // Each question contributes equally to 100 marks
                }
            });

            const percentage = (score / 100) * 100;

            // Show score in the modal
            const modalBody = document.getElementById('scoreModalBody');
            modalBody.textContent = `You scored ${percentage.toFixed(2)}%.`;
            const scoreModal = new bootstrap.Modal(document.getElementById('scoreModal'));
            scoreModal.show();
        }
    </script>
