    <style>

        .hero {

        }

        /* Badge */

        }

        @keyframes floatHero {

<body>

    <div class="container py-4">
        <!-- Search Box -->
        <div class="card shadow-sm border-0 p-4">
            <h4 class="text-center mb-3 text-danger fw-bold">🔍 Certificate Verification</h4>

            <div class="input-group mb-3">
                <input type="text" id="searchTerm" class="form-control form-control-lg"
                    placeholder="Enter Candidate ID or Name" aria-label="Search Certificate">
                <button onclick="searchCandidates()" class="btn btn-danger btn-lg">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>

            <!-- Search Results -->
            <div id="data" class="mt-4 text-center text-muted">
                <em>Enter Candidate ID or Name to verify certificate...</em>
            </div>
        </div>
    </div>







    <!-- Page Content -->

    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



    <script>
        function searchCandidates() {
            const searchTerm = document.getElementById('searchTerm').value;
            const dataContainer = document.getElementById('data');
            // Show loading spinner/message
            dataContainer.innerHTML = `
              <div class="d-flex justify-content-center align-items-center" style="height:100px;">
                <div class="spinner-border text-primary me-2" role="status"></div>
                <span>Loading...</span>
              </div>
            `;

            const url = `https://script.google.com/macros/s/AKfycbwX2TltmU1K6qz6cNyEX3CIJed0voe6hw4bgSIR_kfgZt1VBrGwcZO5aziQm1EFHCDVtQ/exec?searchTerm=${encodeURIComponent(searchTerm)}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    displayData(data);
                })
                .catch(error => {
                    dataContainer.innerHTML = '<div class="alert alert-danger" role="alert">Error fetching data.</div>';
                    console.error('Error fetching data:', error);
                });
        }

        function displayData(data) {
            const dataContainer = document.getElementById('data');
            dataContainer.innerHTML = ''; // Clear previous data

            if (data.length === 0) {
                dataContainer.innerHTML = '<div class="alert alert-warning" role="alert">⚠️ No results found. Please check Candidate ID or Name.</div>';
                return;
            }

            data.forEach(rowData => {
                const dataItem = document.createElement('div');
                dataItem.className = 'data-item text-center ';

                // Prepare candidate details
                const itemContent = `
        <table class="table table-bordered">
            <tbody>
                <tr>
                    <th>Candidate ID</th>
                    <td>${rowData.candidate_id} </td>
                </tr>
                <tr>
                    <th>Full Name</th>
                    <td>${rowData.fullName}<img src="img/verified.png" alt="certified" height="60" width="60"> </td>
                </tr>
                <tr>
                    <th>Domain</th>
                    <td>${rowData.domain}</td>
                </tr>
                <tr>
                    <th>Skills</th>
                    <td>${rowData.skills}</td>
                </tr>
                <tr>
                    <th>Duration</th>
                    <td>${rowData.duration}</td>
                </tr>
                <tr>
                    <th>Certificate</th>
                    <td><a href="${rowData.certificate}" target="_blank" ><button type="button" class="btn btn-success">View Certificate</button></a></td>
                    
                </tr>
            </tbody>
        </table>
        <iframe src="${rowData.certificate}" class="w-100" style="height: 600px;" frameborder="0"></iframe>
        `;

                dataItem.innerHTML = itemContent; // Set candidate details

                // If there is a certificate link, create a clickable link for it
                if (rowData.certificate) {
                    const certLink = document.createElement('a');
                    certLink.href = rowData.certificate;
                    certLink.target = '_blank'; // Open in new tab
                    certLink.textContent = 'Download';
                    certLink.className = 'certificate-link'; // Add CSS class for styling
                    dataItem.appendChild(certLink); // Append the link to the data item
                }

                dataContainer.appendChild(dataItem); // Append the data item to the container
            });
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loadHTML = (url, id) =>
                fetch(url).then(r => r.text())
                    .then(h => document.getElementById(id).innerHTML = h);

            loadHTML("/header.html", "header");
            loadHTML("/footer.html", "footer");
        });
    </script>

                    .then(() => console.log("Service Worker registered"))
                    .catch(err => console.log("SW registration failed", err));
            });
        }
    </script>
