<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="HandheldFriendly" content="true">
  <title>404 - Page Not Found</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">

  <script src="https://fpyf8.com/88/tag.min.js" data-zone="151657" async data-cfasync="false"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(120deg, #1e293b, #334155, #475569);
      background-size: 300% 300%;
      animation: gradientAnimation 8s ease-in-out infinite;
      color: #fff;
      min-height: 100vh;
    }
    @keyframes gradientAnimation {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 10rem;
      font-weight: 700;
      letter-spacing: 10px;
      background: linear-gradient(90deg, #ff6e7f, #bfe9ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
      text-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: textGlow 2s infinite alternate;
      margin-bottom: 0.5rem;
      user-select: none;
    }
    @keyframes textGlow {
      from { text-shadow: 0 0 10px #fff8, 0 8px 32px rgba(0,0,0,0.5);}
      to { text-shadow: 0 0 32px #fff, 0 8px 32px rgba(0,0,0,0.7);}
    }
    .error-message {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: rgba(255,255,255,0.85);
      max-width: 500px;
    }
    .btn-back {
      font-size: 1.1rem;
      text-transform: uppercase;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(90deg, #ff6e7f, #bfe9ff 80%);
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      transition: all 0.3s cubic-bezier(.4,2,.6,1);
      box-shadow: 0 5px 15px rgba(191, 233, 255, 0.15);
      outline: none;
    }
    .btn-back:hover, .btn-back:focus {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 10px 24px rgba(255, 110, 127, 0.25);
      text-decoration: none;
      color: #fff;
    }
    @media (max-width: 768px) {
      .error-code { font-size: 6rem; }
      .error-message { font-size: 1.1rem; }
      .btn-back { padding: 12px 24px; font-size: 1rem; }
    }
    @media (max-width: 480px) {
      .error-code { font-size: 3.5rem; }
      .error-message { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="error-container" role="main" aria-label="404 Page Not Found">
    <div class="error-code" aria-hidden="true">404</div>
    <p class="error-message">Sorry, the page you’re looking for doesn’t exist or has been moved.</p>
    <a href="https://www.alfidotech.com/" class="btn btn-back" aria-label="Back to Home">Back to Home</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
