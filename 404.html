<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>404 • Alfido Tech</title> 
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at top,#0a1d2e,#020b16);
  overflow:hidden;
  color:#fff;
}

/* floating glowing orbs */
.orb{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.6;
  animation:float 10s infinite alternate;
}
.orb.blue{background:#00c6ff; top:10%; left:5%;}
.orb.gold{background:#ffd200; bottom:10%; right:10%; animation-delay:3s;}

@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(-60px)}
}

/* glass card */
.card{
  position:relative;
  z-index:2;
  width:92%;
  max-width:460px;
  padding:45px 40px;
  border-radius:24px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  text-align:center;
}

/* animated illustration */
.illustration{
  width:140px;
  height:140px;
  margin:0 auto 10px;
  position:relative;
}
.circle{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,.4);
  animation:spin 14s linear infinite;
}
.inner{
  position:absolute;
  inset:20px;
  border-radius:50%;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  font-weight:700;
  box-shadow:0 0 30px rgba(0,198,255,.6);
  animation:pulse 2.5s infinite;
}

@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

h1{
  font-size:84px;
  margin:10px 0;
  background:linear-gradient(135deg,#00eaff,#ffd200);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

h2{
  font-size:22px;
  margin-bottom:12px;
}

p{
  font-size:14px;
  opacity:.85;
  line-height:1.6;
  margin-bottom:26px;
}

a.btn{
  display:inline-block;
  padding:13px 34px;
  border-radius:30px;
  font-size:14px;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  box-shadow:0 12px 30px rgba(0,114,255,.45);
  transition:.35s;
}
a.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 20px 45px rgba(0,114,255,.7);
}

.brand{
  margin-top:24px;
  font-size:12px;
  opacity:.6;
}

/* subtle particles */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:#fff;
  opacity:.6;
  border-radius:50%;
  animation:blink 3s infinite ease-in-out;
}
@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:.9}
}
</style>
</head>

<body>

<div class="orb blue"></div>
<div class="orb gold"></div>

<!-- particles -->
<span class="particle" style="top:15%;left:40%"></span>
<span class="particle" style="top:70%;left:20%"></span>
<span class="particle" style="top:35%;left:75%"></span>
<span class="particle" style="top:80%;left:65%"></span>

<div class="card">

  <!-- animated image -->
  <div class="illustration">
    <div class="circle"></div>
    <div class="inner">!</div>
  </div>

  <h1>404</h1>
  <h2>Page Not Found</h2>

  <p>
    The page you’re trying to reach doesn’t exist or was moved.
    Let’s take you back to Alfido Tech.
  </p>

  <a class="btn" href="https://www.alfidotech.com/">Back to Home</a>

  <div class="brand">
    © 2026 Alfido Tech
  </div>

</div>

</body>
</html>
