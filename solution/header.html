<style>

}

/* Mobile menu */
@media (max-width: 991px) {
  .navbar-collapse {
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .navbar-nav .nav-link {
    padding: 12px 0;
    font-size: 16px;
  }

  .dropdown-menu {
    position: static;
    box-shadow: none;

  }
}
</style>
