    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .hero {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

        }

        .badge-custom {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 14px;
        }

        .service-card {
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }



        /* ================= HERO ================= */
        .hero {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }

        /* Badge */
        .badge-custom {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 14px;
            backdrop-filter: blur(6px);
        }

        /* Image animation */
        .hero-img-wrapper img {
            animation: floatHero 6s ease-in-out infinite;
        }

        @keyframes floatHero {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* Mobile spacing */
        @media (max-width: 768px) {
            .hero {
                text-align: center;
            }

            .hero .btn {
                width: 100%;
            }
        }

        .hero-header {
            min-height: 70vh;
            padding-top: 120px;
            padding-bottom: 80px;

            background:
                linear-gradient(135deg,
                    rgba(20, 5, 5, 0.85),
                    rgba(120, 10, 10, 0.85),
                    rgba(20, 5, 5, 0.9)),
                url("img/banar.webp");

            background-repeat: no-repeat;
            background-size: 200%;
            /* zoomed – 50% visible */
            background-position: center;

            display: flex;
            align-items: center;
        }



        @media (max-width: 768px) {
            .hero-header {
                min-height: 75vh;
                padding-top: 100px;
                padding-bottom: 60px;
            }

            .hero-header h1 {
                font-size: 2rem;
            }
        }

        /* Overlay */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
            /* fade effect */
        }

        .popup-overlay.show {
            display: flex;
            opacity: 1;
        }

        .popup-overlay.hide {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Popup Box */
        .popup-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.4s ease;
        }

        /* Success Tick */
        .tick {
            font-size: 60px;
            color: green;
            animation: pop 0.4s ease;
        }

        /* Tick Pop Animation */
        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
            }
        }

        /* Box Fade-in */
        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>

    <script>
        $("#contactForm").on("submit", function (e) {
            e.preventDefault();
            let name = $("#name").val();
            let email = $("#email").val();
            let phone = $("#phone").val();
            let message = $("#message").val();

            let text = `New Contact Request:%0AName: ${name}%0AEmail: ${email}%0APhone: ${phone}%0AMessage: ${message}`;

            // WhatsApp
            window.open(`https://api.whatsapp.com/send?phone=919977465250&text=${text}`, "_blank");

            // Email
            let mailSubject = encodeURIComponent("New Contact Request from Website");
            let mailBody = `Name: ${name}%0AEmail: ${email}%0APhone: ${phone}%0AMessage: ${message}`;
            window.open(`mailto:info@alfidotech.com?subject=${mailSubject}&body=${mailBody}`, "_blank");
        });
    </script>

            loadHTML("/footer.html", "footer");
