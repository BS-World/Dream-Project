<body>
    <div id="header"></div>

    <!-- Main Editor Layout -->
    <div class="container-fluid mt-5 pt-4">

                    Access</p>
            </div>

            <!-- File Explorer Sidebar -->
            <div class="col-md-3 p-3">
                <div id="file-explorer">
                    <h5 class="fw-semibold mb-3"><i class="fa-solid fa-folder-open me-2 text-danger"></i>File Explorer
                    </h5>
                    <button class="btn btn-outline-dark btn-sm mb-3" onclick="openFolder()">
                        <i class="fa-solid fa-folder-tree me-1"></i> Open Folder
                    </button>
                    <div id="folder-contents"></div>
                </div>
            </div>

            <!-- Code Input Area with Buttons -->
            <div class="col-md-4 p-3">
                <h5 class="fw-semibold mb-2"><i class="fa-solid fa-code me-2 text-danger"></i>Write Code
                    (HTML/JS/Bootstrap)</h5>
                <div class="editor-controls mb-2">
                    <button class="btn btn-secondary btn-sm" onclick="createFile()"><i
                            class="fa-solid fa-file-circle-plus me-1"></i> New</button>
                    <button class="btn btn-primary btn-sm" onclick="openFile()"><i
                            class="fa-solid fa-folder-open me-1"></i> Open</button>
                    <button class="btn btn-success btn-sm" onclick="saveFile()"><i
                            class="fa-solid fa-floppy-disk me-1"></i> Save</button>
                    <button class="btn btn-info btn-sm text-white" onclick="toggleTheme()"><i
                            class="fa-solid fa-moon me-1"></i> Dark Mode</button>
                </div>
                <textarea id="code-input" class="form-control" oninput="updatePreview()"
                    placeholder="Type your HTML/Bootstrap/JavaScript code here..."></textarea>
            </div>

            <!-- Live Preview Area -->
            <div class="col-md-5 p-3">
                <h5 class="fw-semibold mb-2"><i class="fa-solid fa-display me-2 text-danger"></i>Live Preview</h5>
                <iframe id="output" class="w-100"></iframe>
            </div>
        </div>
    </div>






    <!-- Page Content -->

    <div id="footer"></div>

    <!-- JavaScript to Update Preview, Handle File Operations, and Display Folder Contents -->
    <script>
        let fileHandle;
        let isDarkMode = false;

        // Dynamic year
        document.getElementById("yearSpan").textContent = new Date().getFullYear();

        // Update preview in real-time
        function updatePreview() {
            const code = document.getElementById("code-input").value;
            const outputFrame = document.getElementById("output");
            const doc = outputFrame.contentDocument || outputFrame.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        // Toggle Dark Mode
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.style.backgroundColor = isDarkMode ? '#020617' : '#f8f9fa';
            document.getElementById('code-input').style.backgroundColor = isDarkMode ? '#0b1120' : '#ffffff';
            document.getElementById('code-input').style.color = isDarkMode ? '#e5e7eb' : '#000';
            document.getElementById('output').style.backgroundColor = isDarkMode ? '#020617' : '#ffffff';
        }

        // Create a new blank file
        function createFile() {
            fileHandle = null;
            document.getElementById("code-input").value = "";
            updatePreview();
            alert("New file created. Start coding!");
        }

        // Open a file and load its content into the editor
        async function openFile() {
            try {
                [fileHandle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'HTML or JavaScript files',
                        accept: {
                            'text/html': ['.html', '.htm'],
                            'text/javascript': ['.js'],
                            'text/plain': ['.txt']
                        }
                    }],
                    multiple: false
                });

                const file = await fileHandle.getFile();
                const content = await file.text();

                document.getElementById("code-input").value = content;
                updatePreview();

            } catch (err) {
                console.error('Error opening file:', err);
            }
        }

        // Save the content in the editor to the file
        async function saveFile() {
            try {
                if (!fileHandle) {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: 'Untitled.html',
                        types: [{
                            description: 'HTML or JavaScript files',
                            accept: {
                                'text/html': ['.html', '.htm'],
                                'text/javascript': ['.js'],
                                'text/plain': ['.txt']
                            }
                        }]
                    });
                }

                const writable = await fileHandle.createWritable();
                await writable.write(document.getElementById("code-input").value);
                await writable.close();

                alert("File saved successfully!");

            } catch (err) {
                console.error('Error saving file:', err);
            }
        }

        // Open a folder and display its contents
        async function openFolder() {
            try {
                const dirHandle = await window.showDirectoryPicker();
                document.getElementById("folder-contents").innerHTML = "";
                for await (const entry of dirHandle.values()) {
                    const div = document.createElement("div");
                    div.className = "file";
                    div.textContent = entry.name;
                    div.onclick = () => loadFileFromFolder(entry);
                    document.getElementById("folder-contents").appendChild(div);
                }
            } catch (err) {
                console.error('Error opening folder:', err);
            }
        }

        // Load file from folder to editor
        async function loadFileFromFolder(fileHandle) {
            if (fileHandle.kind === 'file') {
                const file = await fileHandle.getFile();
                const content = await file.text();
                document.getElementById("code-input").value = content;
                updatePreview();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
