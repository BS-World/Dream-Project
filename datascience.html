    <script>
        function calculateScore() {
            const form = document.getElementById('quiz-form');
            const inputs = form.querySelectorAll('input[type=radio]:checked');
            let score = 0;

            inputs.forEach(input => {
                if (input.value === 'correct') {
                    score += 100 / 19; // Each question contributes equally to 100 marks
                }
            });

            const percentage = (score / 100) * 100;

            // Show score in the modal
            const modalBody = document.getElementById('scoreModalBody');
            modalBody.textContent = `You scored ${percentage.toFixed(2)}%.`;
            const scoreModal = new bootstrap.Modal(document.getElementById('scoreModal'));
            scoreModal.show();
        }
    </script>
